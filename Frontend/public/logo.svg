<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007bff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Camera Body -->
  <rect x="250" y="300" width="300" height="300" rx="60" fill="url(#mainGrad)" filter="url(#glow)" />
  
  <!-- Shutter/Lens Cone -->
  <path d="M570 320 L720 380 Q750 450 720 520 L570 580 Z" fill="white" filter="url(#glow)" />
  <ellipse cx="680" cy="450" rx="15" ry="60" fill="#007bff" opacity="0.2" />

  <!-- Circuit Nodes -->
  <g stroke="white" stroke-width="12" fill="none">
    <path d="M720 450 L800 450" />
    <path d="M720 450 L780 380" />
    <path d="M720 450 L780 520" />
  </g>
  <circle cx="800" cy="450" r="20" fill="#00e5ff" />
  <circle cx="780" cy="380" r="15" fill="white" />
  <circle cx="780" cy="520" r="15" fill="white" />

  <!-- Typography (Optional for Icon version, but adding for completeness) -->
  <text x="512" y="850" font-family="Plus Jakarta Sans, sans-serif" font-weight="900" font-size="140" fill="white" text-anchor="middle">
    Aero<tspan fill="#00e5ff">Meet</tspan>
  </text>
</svg>
