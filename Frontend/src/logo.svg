<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- AeroMeet 3D infinity Camera Base -->
  <g filter="url(#shadow)">
    <path d="M165,100 c0,35.9 -29.1,65 -65,65 c-16.2,0 -31,-5.9 -42.4,-15.8 L142.4,65.8 C156.1,74.3 165,86.2 165,100 z" fill="url(#premiumGold)" opacity="0.8"/>
    <path d="M35,100 c0,-35.9 29.1,-65 65,-65 c16.2,0 31,5.9 42.4,15.8 L57.6,134.2 C43.9,125.7 35,113.8 35,100 z" fill="url(#premiumGold)"/>
    
    <!-- Lens -->
    <circle cx="100" cy="100" r="28" fill="#0f172a" stroke="url(#premiumGold)" stroke-width="4"/>
    <circle cx="100" cy="100" r="12" fill="#1e293b"/>
    <circle cx="105" cy="95" r="4" fill="white" opacity="0.3"/>
  </g>
</svg>